<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Session</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">

        <section class="brand-section">
            <div class="brand-content">
                <div class="brand-logo-left">
                    <span class="logo-circle">S</span>
                    <h2>Session</h2>
                </div>
                
                <div class="artwork-box">
                    <div class="art-shape shape-1"></div>
                    <div class="art-shape shape-2"></div>
                    <div class="art-badge">Creative Workspace</div>
                </div>

                <h3>Turn ideas into reality</h3>
                <p>Platform kolaborasi desain dan pengembangan antarmuka modern yang simpel dan efisien.</p>
            </div>
        </section>

        <section class="form-section">
            <div class="form-wrapper">
                
                <div class="form-header">
                    <div class="form-logo">
                        <span class="logo-circle">S</span>
                        <span class="logo-text">Session</span>
                    </div>
                    <h1>Welcome Back</h1>
                    <p>Silakan masukkan detail akun Anda untuk masuk.</p>
                </div>

                <button type="button" class="btn-sso" aria-label="Sign in with Google">
                    <svg class="icon-google" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="#4285F4" d="M23.7 12.3c0-.8-.1-1.5-.2-2.3H12v4.5h6.6c-.3 1.5-1.1 2.8-2.4 3.7v3.1h3.9c2.3-2.1 3.6-5.2 3.6-9z"/>
                        <path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3.1c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1C3.3 21.4 7.4 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.3 14.2c-.2-.7-.3-1.5-.3-2.2 0-.8.1-1.5.3-2.2V6.7H1.3C.5 8.3 0 10.1 0 12s.5 3.7 1.3 5.3l4-3.1z"/>
                        <path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.3 2.6 1.3 6.7l4 3.1c.9-2.9 3.6-5 6.7-5z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <form action="#" method="POST" class="login-form">
                    
                    <div class="form-group">
                        <label for="username">Email or Username</label>
                        <input type="text" id="username" name="username" placeholder="Masukkan email atau username" required>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                    </div>

                    <div class="remember-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember Me</label>
                    </div>

                    <button type="submit" class="btn-submit">Sign In</button>

                </form>

                <p class="signup-prompt">
                    Don't have an account? <a href="#">Sign up</a>
                </p>

            </div>
        </section>

    </main>

</body>
</html>
